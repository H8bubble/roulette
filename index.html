<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 가능한 한 이전 문서 캐시를 다시 쓰지 않도록 힌트 -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>KUJI BOX - 사용 종료</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Pretendard,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      padding: 36px 28px;
      border-radius: 20px;
      background: #fff;
      color: #222;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    .logo {
      margin-bottom: 10px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    p {
      margin: 0;
      color: #777;
      font-size: 14px;
      line-height: 1.65;
    }

    #status {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f5f5f5;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">KUJI BOX</div>
    <h1>사용이 종료된 주소입니다.</h1>
    <p>
      기존 룰렛 페이지의 브라우저 데이터를 정리하고 있습니다.<br>
      이 주소에서는 더 이상 룰렛을 사용할 수 없습니다.
    </p>

    <div id="status">정리 중...</div>
  </main>

  <script>
    (() => {
      const OLD_PATH = "/roulette/";

      // 현재 룰렛 코드에서 확인된 저장 키 + 같은 용도의 접두사만 삭제합니다.
      // h8bubble.github.io 아래의 다른 프로젝트 데이터는 최대한 건드리지 않습니다.
      const KNOWN_LOCAL_STORAGE_KEYS = [
        "mbr_names",
        "lastViewedNotification"
      ];

      const KNOWN_SESSION_STORAGE_KEYS = [
        "kujibox-roulette-auth-v1"
      ];

      function isOldRouletteUrl(urlString) {
        try {
          const url = new URL(urlString);
          return (
            url.origin === window.location.origin &&
            url.pathname.startsWith(OLD_PATH)
          );
        } catch {
          return false;
        }
      }

      function clearKnownStorage() {
        try {
          for (const key of KNOWN_LOCAL_STORAGE_KEYS) {
            localStorage.removeItem(key);
          }

          // 룰렛 전용으로 보이는 키도 함께 정리
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);

            if (
              key &&
              (
                key.startsWith("mbr_") ||
                key.startsWith("kujibox-roulette-") ||
                key.startsWith("roulette-")
              )
            ) {
              localStorage.removeItem(key);
            }
          }
        } catch (error) {
          console.warn("localStorage 정리 실패:", error);
        }

        try {
          for (const key of KNOWN_SESSION_STORAGE_KEYS) {
            sessionStorage.removeItem(key);
          }

          for (let i = sessionStorage.length - 1; i >= 0; i--) {
            const key = sessionStorage.key(i);

            if (
              key &&
              (
                key.startsWith("kujibox-roulette-") ||
                key.startsWith("roulette-")
              )
            ) {
              sessionStorage.removeItem(key);
            }
          }
        } catch (error) {
          console.warn("sessionStorage 정리 실패:", error);
        }
      }

      async function unregisterOldServiceWorkers() {
        let removed = 0;

        if (!("serviceWorker" in navigator)) {
          return removed;
        }

        try {
          const registrations =
            await navigator.serviceWorker.getRegistrations();

          for (const registration of registrations) {
            try {
              const scope = new URL(registration.scope);

              // /roulette/ 범위의 서비스워커만 제거
              if (
                scope.origin === window.location.origin &&
                scope.pathname.startsWith(OLD_PATH)
              ) {
                const success = await registration.unregister();

                if (success) {
                  removed++;
                }
              }
            } catch (error) {
              console.warn("서비스워커 해제 실패:", error);
            }
          }
        } catch (error) {
          console.warn("서비스워커 목록 확인 실패:", error);
        }

        return removed;
      }

      async function removeOldCacheEntries() {
        let removedEntries = 0;

        if (!("caches" in window)) {
          return removedEntries;
        }

        try {
          const cacheNames = await caches.keys();

          for (const cacheName of cacheNames) {
            const cache = await caches.open(cacheName);
            const requests = await cache.keys();

            for (const request of requests) {
              if (isOldRouletteUrl(request.url)) {
                const success = await cache.delete(request);

                if (success) {
                  removedEntries++;
                }
              }
            }

            // 완전히 비어버린 캐시만 캐시 컨테이너도 제거
            const remaining = await cache.keys();

            if (remaining.length === 0) {
              await caches.delete(cacheName);
            }
          }
        } catch (error) {
          console.warn("Cache Storage 정리 실패:", error);
        }

        return removedEntries;
      }

      async function cleanup() {
        const status =
          document.getElementById("status");

        clearKnownStorage();

        const [
          removedWorkers,
          removedCacheEntries
        ] = await Promise.all([
          unregisterOldServiceWorkers(),
          removeOldCacheEntries()
        ]);

        status.innerHTML =
          "정리가 완료되었습니다.<br>" +
          "서비스워커 " + removedWorkers + "개 해제 · " +
          "기존 캐시 항목 " + removedCacheEntries + "개 삭제";

        // 현재 문서가 이전 서비스워커의 제어를 받고 있었다면
        // unregister 이후 한 번만 재접속하여 제어를 끊습니다.
        try {
          if (
            "serviceWorker" in navigator &&
            navigator.serviceWorker.controller &&
            !sessionStorage.getItem("kujibox-cleanup-reloaded")
          ) {
            sessionStorage.setItem(
              "kujibox-cleanup-reloaded",
              "1"
            );

            window.setTimeout(() => {
              const url =
                new URL(window.location.href);

              url.searchParams.set(
                "_cleanup",
                Date.now().toString()
              );

              window.location.replace(url.toString());
            }, 500);

            return;
          }

          sessionStorage.removeItem(
            "kujibox-cleanup-reloaded"
          );
        } catch (error) {
          console.warn("재접속 처리 실패:", error);
        }
      }

      cleanup();
    })();
  </script>
</body>
</html>
